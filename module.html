<script>
function detectAdminLocation(btn){
 const label=btn.closest('label'),input=label&&label.querySelector('input[type=hidden]'),small=label&&label.querySelector('small');
 if(!navigator.geolocation){toastMsg('Location is not supported.',true);return}

}

function normalizeAdminTime(v){

}
